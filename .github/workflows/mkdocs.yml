name: Build and Deploy Documentation

on:
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        lfs: false

    - name: Setup Git
      run: |
        git config --global user.email "miurahr@linux.com"
        git config --global user.name "CI Docs Builder"

    - name: Prepare Source
      run: |
        git config --global --add safe.directory $GITHUB_WORKSPACE
        git clone --depth 1 https://github.com/osmfoundation/welcome-mat.git
        mkdir -p source docs tm overrides
        cp -r welcome-mat/docs/en/* source/
        cp -r welcome-mat/docs/assets docs/
        cp -r welcome-mat/docs/stylesheets docs/
        cp -r welcome-mat/overrides/* overrides/
        rm -rf welcome-mat

    - name: Prepare OmegaT
      run: |
        curl https://okapiframework.org/binaries/omegat-plugin/okapiFiltersForOmegaT-1.13-1.45.0-dist.zip -o "okapi.zip"
        mkdir -p build/omegat/plugins
        unzip -pq okapi.zip '*/*.jar' > build/omegat/plugins/okapi.jar
        ls -l build/omegat/plugins/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.5'

    - name: Translate
      run: |
        gradle --no-daemon translate

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install MkDocs dependencies
      run: |
        pip install -r requirements.txt

    - name: Build Documentation
      run: |
        mkdocs build --config-file mkdocs.yml --site-dir pages
